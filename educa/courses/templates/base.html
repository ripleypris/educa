<body>

    <ul class="menu">
      {% if request.user.is_authenticated %}  
        <li><form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <p><input type="submit" value="Logout"></p>
        </form></li>
      {% else %}
        <li><a href="{% url 'login' %}">Sign in</a></li>
      {% endif %}
    </ul>
  </div>
  <div id="content">

    {% endblock %}
